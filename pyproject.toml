[project]
name = "clickstack-k8s"
version = "0.0.1"
requires-python = ">=3.12"

# Dependencies of the charm code
# You should list the dependencies of the code in src/, including any charm libraries from PyPI.
# We recommend using uv to maintain this list. For example, 'uv add charmlibs-pathops'.
# If your code uses any libraries from Charmhub, don't list those libraries here. Instead, add a
# 'charm-libs' block in charmcraft.yaml, run `charmcraft fetch-libs` to download the libraries,
# then inspect the libraries for dependencies specified in PYDEPS. List those dependencies here.
dependencies = [
    "ops~=3.7",
    # PYDEPS of lib/charms/traefik_k8s/v2/ingress.py
    "pydantic",
]

[dependency-groups]
# Dependencies of linting and static type checks
lint = [
    "ruff",
    "codespell",
    "pyright",
]
# Dependencies of unit tests
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]
# Dependencies of integration tests
integration = [
    "jubilant>=1.8,<2",
    "pytest",
    "pytest-jubilant>=2.0.1,<3",
    "PyYAML",
]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
# Vendored charm libraries are upstream code; we do not test them.
omit = ["lib/charms/*"]

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s %(message)s"
filterwarnings = ["error"]

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}
extend-exclude = ["__pycache__", "*.egg_info", "lib"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,uv.lock,.opencode"

[tool.pyright]
# TODO: add "tests" once tests/ lands (DESIGN.md stage 1 follow-up).
include = ["src"]
# Vendored charm libraries are on the import path but are not ours to type-check.
extraPaths = ["lib"]
exclude = ["lib"]
pythonVersion = "3.12"
